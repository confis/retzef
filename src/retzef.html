<title data-i18n="docTitle">Retzef – Presentation Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: control-room — playlist rail on the start side, a stage monitor in the middle, item settings under it. */
:root{
  --bg:#eceef3; --panel:#ffffff; --ink:#151a25; --muted:#5b6478; --line:#d6dae3;
  --accent:#d2741f; --accent-ink:#ffffff; --accent-soft:#fbead9; --stage:#0c1018; --danger:#c0392b;
  --display:"Rubik","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --panel:#161b26; --ink:#e6e9f0; --muted:#949db0; --line:#273043;
  --accent:#f0a04b; --accent-ink:#1b1206; --accent-soft:#3a2a17; --stage:#04060a; --danger:#e8705f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --panel:#161b26; --ink:#e6e9f0; --muted:#949db0; --line:#273043;
  --accent:#f0a04b; --accent-ink:#1b1206; --accent-soft:#3a2a17; --stage:#04060a; --danger:#e8705f; color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;gap:14px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{padding:4px 8px;font-size:13px}
.btn.danger{color:var(--danger)}
.addbar{display:flex;gap:6px;flex-wrap:wrap}

.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;flex:1;min-height:0}
@media (max-width:860px){.main{grid-template-columns:1fr}}

.rail{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:300px;max-height:calc(100vh - 110px)}
@media (max-width:860px){.rail{max-height:none}}
.rail-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rail-head h2{font-family:var(--display);font-size:15px;margin:0;font-weight:700}
.rail-head .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px}
.item{display:grid;grid-template-columns:20px 84px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent;cursor:pointer;user-select:none}
.item:hover{background:var(--bg)}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.item.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.item.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.item .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:center;cursor:grab}
.item .thumb{width:84px;aspect-ratio:16/9;background:var(--stage);border-radius:4px;overflow:hidden;position:relative}
.item .meta{min-width:0}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .kind{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.item .del{opacity:.5;border:0;background:none;padding:4px 6px;border-radius:6px}
.item .del:hover{opacity:1;color:var(--danger)}
.rail-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.work{display:flex;flex-direction:column;gap:14px;min-width:0}
.monitor{background:var(--stage);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.screen{width:100%;aspect-ratio:16/9;max-width:100%;position:relative;border-radius:4px;overflow:hidden;background:#000}
.monitor-bar{display:flex;justify-content:space-between;align-items:center;color:#aab2c4;font-size:13px;gap:8px;flex-wrap:wrap}
.monitor-bar .btn{background:#1c2230;border-color:#2c3447;color:#e6e9f0}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.editor{grid-template-columns:1fr}}
.editor .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:70px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* slide renderer */
.host{position:absolute;inset:0;container-type:size;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.layer > img,.layer > video{width:100%;height:100%;object-fit:contain;display:block}
.layer > canvas{display:block;max-width:100%;max-height:100%;background:#fff}
.pptx-box{position:relative;flex:none;overflow:hidden}
.pptx-frame{position:absolute;top:0;left:0;transform-origin:0 0;direction:ltr}
.pptx-frame .pptx-preview-slide-wrapper{position:relative!important}
.pptx-frame audio{opacity:0;transition:opacity .2s}.pptx-frame div:hover>audio,.pptx-frame audio:focus-within{opacity:1}
.host iframe{width:100%;height:100%;border:0;background:#fff}
.tslide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8cqh 9cqw;gap:3cqh;text-align:start}
.tslide h3{font-family:var(--display);font-weight:800;font-size:11cqh;line-height:1.05;margin:0;text-wrap:balance}
.tslide p{font-family:var(--body);font-size:5cqh;line-height:1.35;margin:0;white-space:pre-line;opacity:.88;max-width:75cqw}
.tslide .rule{width:12cqw;height:1.2cqh;border-radius:1cqh}
.th-night{background:#121826;color:#f3f4f8}.th-night .rule{background:#f0a04b}
.th-amber{background:#e58b2f;color:#1d1206}.th-amber .rule{background:#1d1206}
.th-paper{background:#f6f5f1;color:#1a1f2b}.th-paper .rule{background:#d2741f}
.th-teal{background:#0f4c4a;color:#eaf6f3}.th-teal .rule{background:#7fe0c9}
.timer-slide{position:absolute;inset:0;background:#121826;color:#f3f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh}
.timer-slide .lbl{font-family:var(--display);font-size:7cqh;font-weight:700}
.timer-slide .t{font-family:var(--display);font-size:30cqh;font-weight:800;font-variant-numeric:tabular-nums;color:#f0a04b;direction:ltr}
.linkcard{position:absolute;inset:0;background:#1a2030;color:#e6e9f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:6cqw;text-align:center}
.linkcard b{font-family:var(--display);font-size:7cqh}
.linkcard span{font-size:4cqh;opacity:.7;direction:ltr;word-break:break-all}
.linkcard a{font-size:4cqh;color:#f0a04b}
.webwrap{position:absolute;inset:0}
.weblink{position:absolute;bottom:8px;left:8px;background:rgba(10,14,22,.85);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;text-decoration:none}
.thumb .host .tslide,.thumb .host .timer-slide,.thumb .host .linkcard{pointer-events:none}

/* show mode */
.show{position:fixed;inset:0;z-index:50;background:#000;color:#e6e9f0;display:flex}
.show .stage{position:relative;flex:1}
.show .hud{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(18,22,32,.92);border:1px solid #2c3447;padding:6px 8px;border-radius:10px;opacity:0;transition:opacity .25s;z-index:3;font-size:13px}
.show:hover .hud,.show .hud:focus-within{opacity:1}
.show .hud button{white-space:nowrap;background:#1f2636;border:1px solid #333c52;color:#e6e9f0;border-radius:6px;padding:5px 9px}
.show .hud .pos{white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 6px;color:#aab2c4}
.show .blackout{position:absolute;inset:0;background:#000;z-index:2}
.progress{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:#f0a04b;z-index:2;transition:width .3s}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.layer.out{z-index:1}.layer.under{z-index:0}
.tslide .ln{display:block}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress{transition:none}}

.show .console{display:none}
.show.is-console{background:#0b0e15}
.show.is-console .stage{flex:none;width:62%;margin:2%;aspect-ratio:16/9;align-self:center;border:1px solid #2c3447}
.show.is-console .console{display:flex;flex-direction:column;gap:12px;flex:1;padding:2% 0 2% 2%;min-width:0}
.console h4{margin:0;font-size:12px;letter-spacing:.06em;color:#8d96aa;font-weight:700}
.console .next{position:relative;aspect-ratio:16/9;border:1px solid #2c3447;background:#000}
.console .clocks{display:flex;gap:18px;align-items:end;flex-wrap:wrap}
.console .big{font-family:var(--display);font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:#f0a04b;direction:ltr}
.console .clock{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;direction:ltr}
.console .notes{flex:1;overflow:auto;background:#121826;border:1px solid #2c3447;border-radius:8px;padding:12px;font-size:20px;line-height:1.45;white-space:pre-wrap;min-height:80px}
.console .row{display:flex;gap:8px;flex-wrap:wrap}
.console .row button{background:#1f2636;border:1px solid #333c52;color:#e6e9f0;border-radius:6px;padding:6px 10px}

.overview{position:absolute;inset:0;background:rgba(6,8,12,.96);z-index:5;overflow:auto;padding:4%;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-content:start}
.overview .ov{background:none;border:2px solid transparent;border-radius:8px;padding:0;text-align:start;color:#e6e9f0}
.overview .ov.cur{border-color:#f0a04b}
.overview .ov .box{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden}
.overview .ov div.cap{padding:6px 4px;font-size:13px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:100;font-weight:600;max-width:90vw}
.dropzone{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--accent) 18%,transparent);border:4px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:700;color:var(--ink);pointer-events:none}
.keys{font-size:13px;color:var(--muted);line-height:1.8}
kbd{font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
</style>

<div class="app">
  <header>
    <div class="brand"><h1><span data-i18n="brand">Retzef</span><span>.</span></h1><small data-i18n="tagline">Every file in one seamless presentation</small></div>
    <div class="addbar">
      <button class="btn" id="addFiles" data-i18n="addFiles">＋ Files</button>
      <button class="btn" id="addText" data-i18n="addText">＋ Text slide</button>
      <button class="btn" id="addWeb" data-i18n="addWeb">＋ Website / YouTube</button>
      <button class="btn" id="addTimer" data-i18n="addTimer">＋ Break timer</button>
    </div>
    <button class="btn ghost" id="langBtn" aria-label="Language"></button>
    <button class="btn primary" id="presentBtn" data-i18n="presentStart">▶ Present from start</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*,application/pdf,.pdf,.pptx,.ppsx,application/vnd.openxmlformats-officedocument.presentationml.presentation,.ppt,.key" hidden>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="rail-head"><h2 data-i18n="playlist">Playlist</h2><span class="count" id="count"></span></div>
      <ul class="list" id="list"></ul>
      <div class="rail-foot">
        <span data-i18n="railHint">Drag files here, or drag items to reorder</span>
        <span id="pptStatus" hidden style="flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap"></span>
        <span style="margin-inline-start:auto" id="clearWrap"><button class="btn small ghost danger" id="clearBtn" data-i18n="clearAll">Clear all</button></span>
      </div>
    </aside>

    <section class="work">
      <div class="monitor">
        <div class="screen" id="screen"></div>
        <div class="monitor-bar">
          <span id="previewInfo">—</span>
          <span style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn small" id="pgPrev" hidden>Previous page</button>
            <button class="btn small" id="pgNext" hidden>Next page</button>
            <button class="btn small" id="presentHere" data-i18n="presentHere">▶ Present from here</button>
          </span>
        </div>
      </div>
      <div class="editor" id="editor"></div>
      <div class="keys" data-i18n-html="keysHint"></div>
    </section>
  </div>
</div>

<div class="show" id="show" hidden>
  <div class="stage" id="stage">
    <div class="host" id="stageHost"></div>
    <div class="progress" id="progress"></div>
    <div class="blackout" id="blackout" hidden></div>
    <div class="hud">
      <button id="hPrev" data-i18n="hudPrev">◀ Previous</button><span class="pos" id="hPos"></span><button id="hNext" data-i18n="hudNext">Next ▶</button>
      <button id="hOv" data-i18n="hudItems">Items</button><button id="hCon" data-i18n="hudPresenter">Presenter view</button><button id="hFs" data-i18n="hudFs">Fullscreen</button><button id="hExit" data-i18n="hudExit">Exit</button>
    </div>
  </div>
  <div class="console">
    <div class="clocks">
      <div><h4 data-i18n="elapsed">Elapsed</h4><div class="big" id="elapsed">00:00</div></div>
      <div><h4 data-i18n="clockLbl">Time</h4><div class="clock" id="clock"></div></div>
      <div><h4 data-i18n="slideLbl">Slide</h4><div class="clock" id="cPos"></div></div>
    </div>
    <div class="row">
      <button id="cReset" data-i18n="cReset">Reset clock</button><button id="cAud" data-i18n="cAud">Open audience window</button><button id="cBlack" data-i18n="cBlack">Black screen</button><button id="cExit" data-i18n="cExit">Exit</button>
    </div>
    <h4 id="nextLbl" data-i18n="nextUp">Next up</h4>
    <div class="next"><div class="host" id="nextHost"></div></div>
    <h4 data-i18n="notesLbl">Speaker notes</h4>
    <div class="notes" id="notes"></div>
  </div>
  <div class="overview" id="overview" hidden></div>
</div>

/* ---------- transitions & animations engine ---------- */
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function anim(host,elm,kf,o){if(!elm||!elm.animate)return null;const a=elm.animate(kf,Object.assign({fill:'both',easing:'cubic-bezier(.2,.7,.2,1)'},o));(host._anims=host._anims||[]).push(a);return a}
function runTransition(host,out,inn,tr,back){
  let type=tr.type,dur=tr.dur||700;
  if(reduceMotion()){type='fade';dur=Math.min(dur,250)}
  const done=()=>{if(out&&out.parentNode)out.remove()};
  if(out)out.querySelectorAll('video,audio').forEach(v=>{try{v.pause()}catch(e){}});
  // OOXML direction: where the movement goes (l,r,u,d …); going back mirrors it
  let dir=tr.dir||'l';if(back)dir=({l:'r',r:'l',u:'d',d:'u',lu:'rd',rd:'lu',ld:'ru',ru:'ld'})[dir]||dir;
  const v={l:['100%','0'],r:['-100%','0'],u:['0','100%'],d:['0','-100%']}[dir[0]]||['100%','0'];
  const neg=x=>x==='0'?'0':x.startsWith('-')?x.slice(1):'-'+x;
  const from=`translate(${v[0]},${v[1]})`,to=`translate(${neg(v[0])},${neg(v[1])})`;
  let a=null;
  switch(type){
    case 'push':anim(host,out,[{transform:'none'},{transform:to}],{duration:dur});a=anim(host,inn,[{transform:from},{transform:'none'}],{duration:dur});break;
    case 'cover':if(out)out.className='layer under';a=anim(host,inn,[{transform:from},{transform:'none'}],{duration:dur});inn.style.zIndex=1;break;
    case 'pull':if(out){out.style.zIndex=2;a=anim(host,out,[{transform:'none'},{transform:to}],{duration:dur})}break;
    case 'wipe':{const c={l:'inset(0 0 0 100%)',r:'inset(0 100% 0 0)',u:'inset(100% 0 0 0)',d:'inset(0 0 100% 0)'}[dir[0]]||'inset(0 0 0 100%)';inn.style.zIndex=2;
      a=anim(host,inn,[{clipPath:c},{clipPath:'inset(0 0 0 0)'}],{duration:dur,easing:'linear'});break}
    case 'split':{const c=tr.orient==='horz'?'inset(50% 0 50% 0)':'inset(0 50% 0 50%)';inn.style.zIndex=2;a=anim(host,inn,[{clipPath:c},{clipPath:'inset(0 0 0 0)'}],{duration:dur});break}
    case 'circle':inn.style.zIndex=2;a=anim(host,inn,[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],{duration:dur,easing:'ease-in'});break;
    case 'zoom':inn.style.zIndex=2;anim(host,out,[{opacity:1},{opacity:0}],{duration:dur});a=anim(host,inn,[{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{duration:dur});break;
    default:inn.style.zIndex=2;
      if(tr.black){anim(host,out,[{opacity:1},{opacity:0}],{duration:dur/2,easing:'linear'});a=anim(host,inn,[{opacity:0},{opacity:1}],{duration:dur/2,delay:dur/2,easing:'linear'})}
      else a=anim(host,inn,[{opacity:0},{opacity:1}],{duration:dur,easing:'linear'});
  }
  setTimeout(done,dur+30);
  return dur;
}
// keyframes for one PowerPoint effect (presetClass + presetID + subtype)
function fxFrames(e){
  const fly={1:'translate(0,-700px)',2:'translate(1100px,0)',4:'translate(0,700px)',8:'translate(-1100px,0)'}[e.u]||'translate(0,700px)';
  const wipe={1:'inset(0 0 100% 0)',2:'inset(0 0 0 100%)',4:'inset(100% 0 0 0)',8:'inset(0 100% 0 0)'}[e.u]||'inset(100% 0 0 0)';
  if(e.c==='emph'){
    if(e.p===8)return [{transform:'rotate(0)'},{transform:'rotate(360deg)'}];
    if(e.p===6)return [{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}];
    return [{transform:'scale(1)',opacity:1},{transform:'scale(1.08)',opacity:.75},{transform:'scale(1)',opacity:1}];
  }
  switch(e.p){
    case 1:return null; // appear
    case 2:case 3:return [{transform:fly,opacity:1},{transform:'none',opacity:1}];
    case 22:return [{clipPath:wipe},{clipPath:'inset(0 0 0 0)'}];
    case 16:return [{clipPath:'inset(0 50% 0 50%)'},{clipPath:'inset(0 0 0 0)'}];
    case 6:case 21:return [{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}];
    case 23:case 53:case 31:case 49:case 26:return [{transform:'scale(.2)',opacity:0},{transform:'none',opacity:1}];
    case 12:case 37:case 42:case 47:case 30:return [{transform:'translate(0,40px)',opacity:0},{transform:'none',opacity:1}];
    default:return [{opacity:0},{opacity:1}];
  }
}
function fxAll(fx){return [...(fx.auto||[]),...[].concat(...(fx.clicks||[]))]}
// put a slide into the state after `step` clicks, with no motion
function fxState(layer,fx,step){
  const all=fxAll(fx),seen=new Set();
  all.forEach(e=>{const t=layer._resolve(e);if(!t||seen.has(t))return;seen.add(t);t.style.visibility=e.c==='entr'?'hidden':''});
  const n=step==='all'?(fx.clicks||[]).length:step;
  const shown=[...(step===0&&(fx.auto||[]).length?[]:fx.auto||[]),...[].concat(...(fx.clicks||[]).slice(0,n))];
  shown.forEach(e=>{const t=layer._resolve(e);if(!t)return;if(e.c==='entr')t.style.visibility='';else if(e.c==='exit')t.style.visibility='hidden'});

function playFx(host,effects,baseDelay=0){
  const layer=host._layer;if(!layer||!layer._resolve)return 0;let end=0;const rm=reduceMotion();
  effects.forEach(e=>{
    const t=layer._resolve(e);if(!t)return;
    const delay=baseDelay+(rm?0:e.t),dur=rm?1:e.d;end=Math.max(end,delay+dur);
    let kf=fxFrames(e);
    if(e.c==='entr'){setTimeout(()=>{t.style.visibility=''},delay);if(kf)anim(host,t,kf,{duration:dur,delay})}
    else if(e.c==='exit'){if(kf){kf=kf.slice().reverse();const a=anim(host,t,kf,{duration:dur,delay,fill:'forwards'});if(a)a.onfinish=()=>{t.style.visibility='hidden';a.cancel()}}else setTimeout(()=>{t.style.visibility='hidden'},delay)}

  });

}

async function addFiles(files){
  let added=0,last=null;
  for(const f of files){
    const n=f.name.toLowerCase();let type=null;
    if(f.type.startsWith('image/'))type='image';else if(f.type==='application/pdf'||n.endsWith('.pdf'))type='pdf';else if(f.type.startsWith('video/'))type='video';
    else if(n.endsWith('.pptx')||n.endsWith('.ppsx')||f.type==='application/vnd.openxmlformats-officedocument.presentationml.presentation')type='pptx';
    else if(/\.(ppt|pps|key|odp)$/.test(n)){toast(t('oldFormat'),7000);continue}
    if(!type){toast(t('unsupportedType',f.name));continue}
    const it={id:uid(),type,name:f.name.replace(/\.[^.]+$/,''),notes:''};if(n.endsWith('.ppsx'))it.ext='ppsx';
    await putBlob(it.id,f);items.push(it);last=it;added++;
    if(type==='pptx')getPptx(it).then(()=>{renderList();if(selectedId===it.id){renderPreview();renderEditor()}}).catch(e=>toast(t('errReadPptx',f.name,(e.message||e)),6000));
    if(type==='pdf')getPdf(it).then(()=>{renderList();if(selectedId===it.id)renderPreview()}).catch(e=>toast(t('errReadPdf',f.name)));
  }
  if(added){save();renderList();select(last.id);toast(added===1?t('addedOne'):t('addedN',added))}
}

  st.append(dot,txt);
  if(pptInfo.ok){
    const selm=document.createElement('select');selm.id='pptModeSel';selm.className='btn small';selm.setAttribute('aria-label',t('pptModeAria'));
    selm.innerHTML='<option value="native">'+t('pptModeNative')+'</option><option value="builtin">'+t('pptModeBuiltin')+'</option>';selm.value=mode;
    selm.onchange=()=>{try{localStorage.setItem('retzef.pptMode',selm.value)}catch(e){}renderEditor()};
    selm.style.marginInlineStart='auto';st.append(selm);
  }
}
async function initDesktop(){
  if(!DESK)return;
  const st=$('#pptStatus');st.hidden=false;st.textContent=t('checkingPpt');
  try{pptInfo=await DESK.pptCheck()}catch(e){pptInfo={ok:false,error:String(e)}}
  renderPptStatus();
  renderEditor();
  DESK.onPptState(onPptState);DESK.onPptEnded(onPptEnded);
}
async function prepareNative(){
  const list=items.filter(useNative);if(!list.length)return;
  toast(t('preparingPpt'),2500);
  for(const it of list){
    try{
      const has=await DESK.pptHasFile(it.id,extOf(it));
      const buf=has?null:await blobs.get(it.id).arrayBuffer();
      const r=await DESK.pptPrepare(it.id,extOf(it),buf);
      if(!r.ok)throw new Error(r.error||'');
      if(r.count&&r.count!==it.pages){it.pages=r.count;save()}
    }catch(e){it._nativeFail=true;toast(t('pptOpenFail',it.name,(e.message||'')),7000)}
  }
}
function nativeLabel(){
  const n=nativeCur;if(!n)return '';
  if(n.closed)return n.done?t('showEnd'):t('deckClosed');
  return t('natSlide',n.slide||1,n.count||'?')+(n.clicks?t('natAnim',n.click,n.clicks):'');
}
function renderNativeUI(){
  const s=seq[pos],n=nativeCur;if(!s||!n)return;const it=s.it;
  const host=$('#stageHost');
  if(n.closed){renderSlide(host,null);const c=document.createElement('div');c.className='linkcard';c.innerHTML=n.done?'<b>'+t('showEnd')+'</b><span>'+t('showEndHint')+'</span>':'<b>'+t('deckClosedPp')+'</b><span>'+t('deckClosedHint')+'</span>';host.appendChild(c)}
  else if(host._natSlide!==n.slide||host._natId!==it.id){renderSlide(host,it,(n.slide||1)-1,'preview');host._natSlide=n.slide;host._natId=it.id}
  if($('#show').classList.contains('is-console')){
    const nh=$('#nextHost');const nx=seq[pos+1];
    if(!n.closed&&n.clicks&&n.click<n.clicks)renderSlide(nh,it,(n.slide||1)-1,'next');
    else if(!n.closed&&n.slide<n.count)renderSlide(nh,it,n.slide,'next');
    else if(nx)renderSlide(nh,nx.it,nx.p,'next');else{renderSlide(nh,null);nh.innerHTML='<div class="linkcard"><b>'+t('deckEnd')+'</b></div>'}
  }
  const sn=it.slideNotes?it.slideNotes[(n.slide||1)-1]||'':'';
  $('#notes').textContent=[it.notes,sn].filter(Boolean).join('\n\n')||t('noNotes');
  const label=`${pos+1} / ${seq.length} · ${nativeLabel()}`;$('#hPos').textContent=label;$('#cPos').textContent=label;
  const left=n.clicks?n.clicks-n.click:0;
  $('#nextLbl').textContent=!n.closed&&left>0?t('nextUpN',left===1?t('oneAnim'):t('nAnims',left)):t('nextUp');
  $('#progress').style.width=((pos+1)/seq.length*100)+'%';
  if(audHost()){renderSlide(audHost(),null)}
}
async function goNative(s,o){
  const it=s.it;
  if(nativeCur&&nativeCur.id===it.id&&!o.restart){renderNativeUI();return}
  nativeCur={id:it.id,slide:o.step==='all'?(it.pages||1):1,count:it.pages||0,click:0,clicks:0,closed:false};
  $('#stageHost')._natSlide=null;renderNativeUI();
  const r=await DESK.pptStart({id:it.id,ext:extOf(it),at:o.step==='all'?'last':1});
  if(!r||!r.ok){
    nativeCur=null;it._nativeFail=true;toast(t('nativeDisplayFail')+((r&&r.error)||''),7000);
    const id=it.id;buildSeq();go(Math.max(0,seq.findIndex(x=>x.it.id===id)),{force:true,step:o.step});return;
  }
  if(r.count){nativeCur.count=r.count}
  renderNativeUI();
}
function onPptState(st){
  if(!nativeCur||nativeCur.closed||!showing)return;
  Object.assign(nativeCur,{slide:st.slide||nativeCur.slide,count:st.count||nativeCur.count,click:st.click||0,clicks:st.clicks||0});
  renderNativeUI();
}
function onPptEnded(ev){
  if(!nativeCur||ev.id!==nativeCur.id||!showing)return;
  if(ev.completed){if(pos<seq.length-1){nativeCur=null;go(pos+1,{force:true})}else{nativeCur.closed=true;nativeCur.done=true;renderNativeUI()}}
  else{nativeCur.closed=true;renderNativeUI()}
}
function leaveNative(){if(nativeCur){nativeCur=null;DESK.pptStop()}}
function buildSeq(){seq=[];items.forEach(it=>{if(useNative(it)){seq.push({it,p:0,native:true});return}const n=PAGED.includes(it.type)?(it.pages||1):1;for(let p=0;p<n;p++)seq.push({it,p})})}
async function startShow(fromId,fromPage=0){
  if(!items.length){toast(t('addBeforeShow'));return}
  await Promise.all([...items.filter(i=>i.type==='pdf').map(i=>getPdf(i).catch(()=>null)),...items.filter(i=>i.type==='pptx').map(i=>getPptx(i).catch(()=>null))]);
  if(DESK)await prepareNative();
  buildSeq();
  if(DESK){try{const sc=await DESK.screens();if(sc.count>1&&!audHost())openAudience()}catch(e){}}
  showing=true;black=false;$('#blackout').hidden=true;$('#show').hidden=false;$('#overview').hidden=true;
  t0=Date.now();clearInterval(tick);tick=setInterval(updClock,500);updClock();
  try{const r=$('#show').requestFullscreen?.();if(r&&r.catch)r.catch(()=>{})}catch(e){}
  pos=-1;nativeCur=null;
  let start=seq.findIndex(s=>s.it.id===fromId&&(s.native||s.p===fromPage));
  go(Math.max(0,start),{});
}
function stopShow(){leaveNative();showing=false;clearInterval(tick);clearTimeout(advT);renderSlide($('#stageHost'),null);renderSlide($('#nextHost'),null);$('#show').hidden=true;
  if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});if(aud&&!aud.closed)renderSlide(aud.document.getElementById('h'),null)}
function go(i,o={}){
  const prevPos=pos;pos=Math.max(0,Math.min(seq.length-1,i));const s=seq[pos],nx=seq[pos+1];
  if(nativeCur&&(!s.native||s.it.id!==nativeCur.id))leaveNative();
  if(s.native){clearTimeout(advT);step=0;goNative(s,o);if(!$('#overview').hidden)renderOverview();return}
  const fx=slideFx(s);step=o.step==='all'?(fx?fx.clicks.length:0):(o.step||0);
  const tr=o.noTr||prevPos===pos&&!o.force?null:slideTr(s);
  const ro={tr,step,fx,back:!!o.back};
  renderSlide($('#stageHost'),s.it,s.p,'show',ro);
  scheduleAdvance();
  if($('#show').classList.contains('is-console')){
    if(fx&&step<fx.clicks.length)renderSlide($('#nextHost'),s.it,s.p,'next');else if(nx)renderSlide($('#nextHost'),nx.it,nx.p,'next');else{renderSlide($('#nextHost'),null);$('#nextHost').innerHTML='<div class="linkcard"><b>'+t('deckEnd')+'</b></div>'}
  }
  const sn=s.it.type==='pptx'&&s.it.slideNotes?s.it.slideNotes[s.p]||'':'';
  $('#notes').textContent=[s.it.notes,sn].filter(Boolean).join('\n\n')||t('noNotes');
  $('#progress').style.width=((pos+1)/seq.length*100)+'%';
  if(audHost()){renderSlide(audHost(),s.it,s.p,'show',ro);const sv=$('#stageHost video');if(sv)sv.muted=true}
  updStep();
  if(!$('#overview').hidden)renderOverview();
}
function updStep(){
  if(nativeCur&&seq[pos]&&seq[pos].native){renderNativeUI();return}
  const fx=slideFx(seq[pos]),left=fx?fx.clicks.length-step:0;
  const label=`${pos+1} / ${seq.length}`+(fx&&fx.clicks.length?` · ${step}/${fx.clicks.length}`:'');$('#hPos').textContent=label;$('#cPos').textContent=label;
  $('#nextLbl').textContent=left>0?t('nextUpN',left===1?t('oneAnim'):t('nAnims',left)):t('nextUp');
}
function next(){
  if(!showing)return;
  if(nativeCur&&seq[pos]&&seq[pos].native){if(nativeCur.done)return;if(nativeCur.closed)go(pos+1,{force:true});else DESK.pptNext();return}const fx=slideFx(seq[pos]);
  if(fx&&step<fx.clicks.length){const eff=fx.clicks[step];step++;playFx($('#stageHost'),eff);if(audHost())playFx(audHost(),eff);updStep();scheduleAdvance();return}
  if(pos<seq.length-1)go(pos+1);
}
function prev(){
  if(!showing)return;
  if(nativeCur&&seq[pos]&&seq[pos].native){
    const n=nativeCur;
    if(n.done){go(pos,{restart:true,force:true,step:'all'});return}
    if(n.closed||((n.slide||1)<=1&&!n.click)){if(pos>0)go(pos-1,{step:'all',back:true});else if(n.closed)go(pos,{restart:true,force:true});return}
    DESK.pptPrev();return}
  if(step>0){go(pos,{step:step-1,noTr:true});return}
  if(pos>0)go(pos-1,{step:'all',back:true});
}
// PowerPoint "after N seconds" auto-advance
function scheduleAdvance(){
  clearTimeout(advT);const s=seq[pos];if(!s)return;const tr=slideTr(s),fx=slideFx(s);
  if(s.it.type!=='pptx'||!tr||tr.adv==null)return;
  if(fx&&step<fx.clicks.length&&tr.adv>0){advT=setTimeout(next,Math.max(tr.adv,500));return}
  if(!fx||step>=fx.clicks.length)advT=setTimeout(next,Math.max(tr.adv,300)+(tr.dur||0));
}
function updClock(){$('#elapsed').textContent=fmt((Date.now()-t0)/1000);$('#clock').textContent=new Date().toLocaleTimeString(LANG==='he'?'he-IL':'en-US',{hour:'2-digit',minute:'2-digit'})}
function toggleBlack(){black=!black;$('#blackout').hidden=!black;if(aud&&!aud.closed)aud.document.getElementById('b').hidden=!black}
function toggleConsole(){$('#show').classList.toggle('is-console');setTimeout(()=>go(pos,{step,noTr:true}),50)}
function toggleFs(){try{if(document.fullscreenElement)document.exitFullscreen();else{const r=$('#show').requestFullscreen?.();if(r&&r.catch)r.catch(()=>toast(t('fsUnavail')))}}catch(e){toast(t('fsUnavail'))}}
function renderOverview(){const ov=$('#overview');ov.innerHTML='';const cur=seq[pos]?.it.id;
  items.forEach((it,i)=>{const b=document.createElement('button');b.className='ov'+(it.id===cur?' cur':'');b.innerHTML='<div class="box"><div class="host"></div></div><div class="cap"></div>';
    b.querySelector('.cap').textContent=(i+1)+'. '+(it.name||'');b.onclick=()=>{ov.hidden=true;go(seq.findIndex(s=>s.it.id===it.id),{force:true})};ov.appendChild(b);
    requestAnimationFrame(()=>renderSlide(b.querySelector('.host'),it,0,'thumb'))})}
function toggleOverview(){const ov=$('#overview');ov.hidden=!ov.hidden;if(!ov.hidden)renderOverview()}
function openAudience(){
  let w=null;try{w=window.open('','retzef-audience','width=1280,height=720')}catch(e){}
  if(!w){toast(t('audBlocked'),7000);return}
  aud=w;const d=w.document;d.open();d.write('<!doctype html><html dir="'+(LANG==='he'?'rtl':'ltr')+'"><head><meta charset="utf-8"><title>'+t('audTitle')+'</title><style>'+[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n')+'html,body{margin:0;height:100%;background:#000}</style></head><body><div class="host" id="h"></div><div class="blackout" id="b" style="position:fixed;inset:0;background:#000" hidden></div><p style="position:fixed;bottom:8px;left:8px;color:#555;font:12px sans-serif" id="tip">'+t('audTip')+'</p></body></html>');d.close();
  d.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){d.documentElement.requestFullscreen?.().catch(()=>{});d.getElementById('tip').remove();return}onKey(e)});
  if(!$('#show').classList.contains('is-console'))toggleConsole();else go(pos,{step,noTr:true});
  toast(t('audOpened'));
}
function onKey(e){
  if(!showing)return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')go(0,{force:true});else if(k==='End')go(seq.length-1,{force:true});
  else if(k==='b'||k==='B'||k==='.'||k==='נ')toggleBlack();
  else if(k==='p'||k==='P'||k==='פ')toggleConsole();
  else if(k==='g'||k==='G'||k==='ע')toggleOverview();
  else if(k==='f'||k==='F'||k==='כ')toggleFs();
  else if(k==='Escape'){if(!$('#overview').hidden)$('#overview').hidden=true;else stopShow()}
}
document.addEventListener('keydown',onKey);
$('#stage').addEventListener('click',e=>{if(e.target.closest('.hud,video,audio,iframe,a,.overview,canvas.noclick'))return;if(e.target.closest('#stageHost')||e.target.id==='blackout')next()});
$('#hPrev').onclick=prev;$('#hNext').onclick=next;$('#hOv').onclick=toggleOverview;$('#hCon').onclick=toggleConsole;$('#hFs').onclick=toggleFs;$('#hExit').onclick=stopShow;
$('#cReset').onclick=()=>{t0=Date.now();updClock()};$('#cBlack').onclick=toggleBlack;$('#cExit').onclick=stopShow;$('#cAud').onclick=openAudience;
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(showing)go(pos,{step,noTr:true});else renderPreview()},200)});

/* ---------- sample playlist ---------- */
function sampleImage(){return new Promise(res=>{const c=document.createElement('canvas');c.width=1600;c.height=900;const g=c.getContext('2d');
  g.fillStyle='#f6f5f1';g.fillRect(0,0,1600,900);g.fillStyle='#1a1f2b';g.font='bold 64px Assistant, Arial';const _rtl=LANG==='he';g.textAlign=_rtl?'right':'left';g.direction=_rtl?'rtl':'ltr';g.fillText(t('sampleChartTitle'),_rtl?1500:100,130);
  const v=[42,55,61,78],lab=['Q1','Q2','Q3','Q4'];v.forEach((x,i)=>{const bw=220,gap=110,xx=200+i*(bw+gap),h=x*7;g.fillStyle=i===3?'#d2741f':'#9aa3b5';g.fillRect(xx,800-h,bw,h);
    g.fillStyle='#1a1f2b';g.textAlign='center';g.font='bold 44px Assistant, Arial';g.fillText(x+'',xx+bw/2,780-h);g.font='36px Assistant, Arial';g.fillText(lab[i],xx+bw/2,850)});
  g.strokeStyle='#1a1f2b';g.lineWidth=3;g.beginPath();g.moveTo(150,800);g.lineTo(1500,800);g.stroke();c.toBlob(b=>res(b),'image/png')})}
async function seed(){
  const img={id:uid(),type:'image',name:t('sImgName'),notes:t('sImgNotes')};
  await putBlob(img.id,await sampleImage());
  items=[
    {id:uid(),type:'text',name:t('sOpenName'),title:t('sOpenTitle'),body:t('sOpenBody'),theme:'night',notes:t('sOpenNotes')},
    img,
    {id:uid(),type:'timer',name:t('sTimerName'),minutes:10,label:t('sTimerLabel'),notes:t('sTimerNotes')},
    {id:uid(),type:'web',name:t('sWebName'),url:t('sWebUrl'),notes:''},
    {id:uid(),type:'text',name:t('sEndName'),title:t('sEndTitle'),body:t('sEndBody'),theme:'amber',notes:''}
  ];save();
}

/* ---------- boot ---------- */
(async()=>{
  db=await idbOpen();
  const stored=await idb('meta','readonly',s=>s.get('playlist'));
  if(Array.isArray(stored)){items=stored;
    for(const it of items)if(FILED.includes(it.type)){const b=await idb('files','readonly',s=>s.get(it.id));if(b){blobs.set(it.id,b);urls.set(it.id,URL.createObjectURL(b))}}
    items=items.filter(it=>!FILED.includes(it.type)||blobs.has(it.id));
  }else await seed();
  bindClear();renderList();if(items[0])select(items[0].id);else{renderPreview();renderEditor()}
  initDesktop();
})();
})();
</script>
